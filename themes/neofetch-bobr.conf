# neofetch-bobr.conf — Kurwa Linux neofetch config
# Drop into ~/.config/neofetch/config.conf
# Bóbr-approved. Dark. Opinionated.

print_info() {
    info title
    info underline
    info "OS" distro
    info "Host" model
    info "Kernel" kernel
    info "Uptime" uptime
    info "Packages" packages
    info "Shell" shell
    info "Resolution" resolution
    info "DE" de
    info "WM" wm
    info "WM Theme" wm_theme
    info "Theme" theme
    info "Terminal" term
    info "CPU" cpu
    info "GPU" gpu
    info "Memory" memory
    info cols
}

# ASCII art source — use Arch logo (we're proud of it, as you know)
image_backend="ascii"
ascii_distro="arch"
ascii_bold="on"

# Colors: red rage palette
colors=(1 1 3 3 7 7)
bold="on"
underline_enabled="on"
underline_char="─"

# Clean output
title_fqdn="off"
kernel_shorthand="on"
distro_shorthand="off"
os_arch="on"
uptime_shorthand="on"
memory_percent="on"
memory_unit="gib"
package_managers="on"
shell_path="off"
shell_version="on"
speed_type="bios_limit"
speed_shorthand="on"
cpu_brand="on"
cpu_speed="on"
cpu_cores="logical"
cpu_temp="C"
gpu_brand="on"
gpu_type="all"
refresh_rate="on"
gtk_shorthand="on"
gtk2="on"
gtk3="on"
